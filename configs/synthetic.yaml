data:
  train_path: data/synthetic/train.jsonl
  eval_path: data/synthetic/test.jsonl

model:
  input_dim: 128
  hidden_dim: 256
  thought_slots: 8
  num_classes: 2
  solver: rk4
  horizon: 1.0
  steps: 12
  tau_min: 0.05
  tau_max: 5.0
  diffusion_weight: 0.05

train:
  seed: 13
  device: cpu
  batch_size: 32
  epochs: 5
  lr: 3.0e-4
  weight_decay: 1.0e-2
  clip_grad_norm: 1.0
  output_dir: outputs/synthetic

eval:
  device: cpu
  batch_size: 64
  checkpoint_path: outputs/synthetic/ct_mcot.pt
  output_dir: outputs/synthetic
