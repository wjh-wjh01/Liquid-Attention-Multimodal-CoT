[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-mcot"
version = "0.1.0"
description = "Continuous-Time Multimodal Chain-of-Thought reasoning reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CT-MCoT Authors"}]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
vlm = ["transformers>=4.41", "accelerate>=0.30", "peft>=0.11", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
